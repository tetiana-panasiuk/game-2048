<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2fb" />
    <title>2048</title>
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Colour theme (see styles.css), set before first paint: ?theme= wins,
      // then the saved choice. "ocean" is the default and has no data-theme.
      (function () {
        var THEMES = ["lavender", "mint", "midnight"];
        var t = new URLSearchParams(location.search).get("theme");
        if (THEMES.indexOf(t) === -1 && t !== "ocean") {
          t = null; // missing or unknown: use the saved choice
          try { t = localStorage.getItem("2048:theme"); } catch (e) {}
        }
        if (THEMES.indexOf(t) !== -1) document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=f16be3b3" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="score-value" data-testid="score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Best</span>
            <span class="score-value" data-testid="best-score">0</span>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <p class="hint">
          <span class="hint-touch">Swipe to join the tiles.</span>
          <span class="hint-desktop">Use arrow keys or WASD to join the tiles.</span>
        </p>
        <div class="toolbar-actions">
          <div class="theme-menu">
            <button type="button" class="btn btn--icon" data-testid="theme-button" aria-label="Colour theme" aria-haspopup="true" aria-expanded="false" aria-controls="theme-popover">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3a9 9 0 0 0 0 18c1.1 0 2-.9 2-2 0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 22 7.6C21.5 4.9 17.3 3 12 3Z" />
                <circle cx="7.5" cy="11" r="1" fill="currentColor" />
                <circle cx="10" cy="7" r="1" fill="currentColor" />
                <circle cx="15" cy="7" r="1" fill="currentColor" />
              </svg>
            </button>
            <div class="theme-popover" id="theme-popover" data-testid="theme-popover" role="radiogroup" aria-label="Colour theme" hidden>
              <button type="button" class="swatch" role="radio" data-theme-choice="ocean" data-testid="theme-option-ocean" aria-label="Ocean" title="Ocean"></button>
              <button type="button" class="swatch" role="radio" data-theme-choice="lavender" data-testid="theme-option-lavender" aria-label="Lavender" title="Lavender"></button>
              <button type="button" class="swatch" role="radio" data-theme-choice="mint" data-testid="theme-option-mint" aria-label="Mint" title="Mint"></button>
              <button type="button" class="swatch" role="radio" data-theme-choice="midnight" data-testid="theme-option-midnight" aria-label="Midnight" title="Midnight"></button>
            </div>
          </div>
          <button type="button" class="btn" data-testid="new-game-button">New game</button>
        </div>
      </div>

      <div class="board-wrap">
        <!-- 16 cells are created by ui.js -->
        <div class="board" data-testid="board"></div>
        <!-- win / game-over overlays are inserted here by ui.js while visible -->
        <div class="messages" id="messages"></div>
      </div>
    </main>

    <script type="module" src="src/ui.js?v=f16be3b3"></script>
  </body>
</html>
