<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2fb" />
    <title>2048</title>
    <script>
      // Colour theme (see styles.css), set before first paint: ?theme= wins,
      // then the saved choice. "ocean" is the default and has no data-theme.
      (function () {
        var THEMES = ["lavender", "mint", "midnight"];
        var t = new URLSearchParams(location.search).get("theme");
        if (THEMES.indexOf(t) === -1 && t !== "ocean") {
          t = null; // missing or unknown: use the saved choice
          try { t = localStorage.getItem("2048:theme"); } catch (e) {}
        }
        if (THEMES.indexOf(t) !== -1) document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=5190e68f" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="score-value" data-testid="score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Best</span>
            <span class="score-value" data-testid="best-score">0</span>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <p class="hint">
          <span class="hint-touch">Swipe to join the tiles.</span>
          <span class="hint-desktop">Use arrow keys or WASD to join the tiles.</span>
        </p>
        <button type="button" class="btn" data-testid="new-game-button">New game</button>
      </div>

      <div class="board-wrap">
        <!-- 16 cells are created by ui.js -->
        <div class="board" data-testid="board"></div>
        <!-- win / game-over overlays are inserted here by ui.js while visible -->
        <div class="messages" id="messages"></div>
      </div>

      <div class="themes" role="radiogroup" aria-label="Colour theme">
        <button type="button" class="swatch" role="radio" data-theme-choice="ocean" data-testid="theme-ocean" aria-label="Ocean" title="Ocean"></button>
        <button type="button" class="swatch" role="radio" data-theme-choice="lavender" data-testid="theme-lavender" aria-label="Lavender" title="Lavender"></button>
        <button type="button" class="swatch" role="radio" data-theme-choice="mint" data-testid="theme-mint" aria-label="Mint" title="Mint"></button>
        <button type="button" class="swatch" role="radio" data-theme-choice="midnight" data-testid="theme-midnight" aria-label="Midnight" title="Midnight"></button>
      </div>
    </main>

    <script type="module" src="src/ui.js?v=5190e68f"></script>
  </body>
</html>
