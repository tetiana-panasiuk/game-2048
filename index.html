<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="score-value" data-testid="score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Best</span>
            <span class="score-value" data-testid="best-score">0</span>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <p class="hint">Join the tiles. Arrow keys or WASD.</p>
        <button type="button" class="btn" data-testid="new-game-button">New game</button>
      </div>

      <div class="board-wrap">
        <!-- 16 cells are created by ui.js -->
        <div class="board" data-testid="board"></div>
        <!-- win / game-over overlays are inserted here by ui.js while visible -->
        <div class="messages" id="messages"></div>
      </div>
    </main>

    <script type="module" src="src/ui.js"></script>
  </body>
</html>
